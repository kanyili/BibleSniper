<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手指跑步競速（雙指交替版）</title>
    <style>
        :root {
            --bg-color: #0b0f19;          
            --primary-color: #00f3ff;     
            --success-color: #00ffcc;     
            --text-color: #ffffff;        
            --border-glow: rgba(0, 243, 255, 0.2); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #rotate-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            pointer-events: none;
            box-sizing: border-box;
            padding: 10px 20px 16px 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        .player-zone {
            width: 48%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 15px;
            position: relative;
            border: 2px dashed var(--border-glow);
            box-sizing: border-box;
        }

        .player-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 5px;
        }

        .step-count {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--success-color);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        #command-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            text-align: center;
            pointer-events: none;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
        }

        #command-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #0066ff);
            color: var(--text-color);
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        
        .btn-primary:disabled {
            background: #2a3b4c;
            color: #ff8080;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h2>請將手機轉為橫向</h2>
        <p>本遊戲需使用橫向畫面進行手指跑步競速</p>
    </div>

    <div id="game-container">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div class="player-zone" id="zone-p1">
                <div class="player-header">左側區域步數</div>
                <div class="step-count" id="score-p1">0</div>
            </div>

            <div class="player-zone" id="zone-p2">
                <div class="player-header">右側區域步數</div>
                <div class="step-count" id="score-p2">0</div>
            </div>
        </div>

        <div id="command-container">
            <div id="command-display">請將雙指伸入鏡頭跑步</div>
        </div>

        <div id="overlay-screen" class="interactive">
            <h1 class="game-title">手指跑步競速（雙指交替版）</h1>
            <button class="btn-primary" id="start-btn" disabled>正在初始化手部模組...</button>
        </div>
    </div>

    <script type="module">
        import { HandLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs";

        let handLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;

        // 紀錄左右兩側區域的雙指跑步狀態
        const sideStats = {
            left: { steps: 0, lastIndexY: 0, lastMiddleY: 0, lastActiveFinger: null },
            right: { steps: 0, lastIndexY: 0, lastMiddleY: 0, lastActiveFinger: null }
        };

        const startBtn = document.getElementById('start-btn');
        const overlayScreen = document.getElementById('overlay-screen');
        const webcamVideo = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const drawingUtils = new DrawingUtils(canvasCtx);

        const commandDisplay = document.getElementById('command-display');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');

        async function preloadModel() {
            try {
                startBtn.innerText = "正在載入 WASM...";
                const visionFilesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                );
                startBtn.innerText = "正在載入 AI 手部模型...";
                handLandmarker = await HandLandmarker.createFromOptions(visionFilesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 2
                });
                startBtn.disabled = false;
                startBtn.innerText = "開始遊戲";
            } catch (err) {
                startBtn.innerText = "錯誤: " + err.message;
            }
        }

        preloadModel();

        startBtn.addEventListener('click', async () => {
            if (!handLandmarker) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                webcamVideo.srcObject = stream;
                webcamVideo.addEventListener('loadeddata', () => {
                    webcamRunning = true;
                    overlayScreen.style.opacity = '0';
                    setTimeout(() => overlayScreen.style.display = 'none', 300);
                    requestAnimationFrame(predictWebcam);
                });
            } catch (err) {
                alert('無法啟用攝影機');
            }
        });

        async function predictWebcam() {
            if (canvasElement.width !== webcamVideo.videoWidth || canvasElement.height !== webcamVideo.videoHeight) {
                canvasElement.width = webcamVideo.videoWidth;
                canvasElement.height = webcamVideo.videoHeight;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcamVideo.currentTime) {
                lastVideoTime = webcamVideo.currentTime;
                const handResult = handLandmarker.detectForVideo(webcamVideo, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                let rawHands = handResult.landmarks || [];

                for (const landmarks of rawHands) {
                    drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, { color: '#00F3FF', lineWidth: 2 });
                    drawingUtils.drawLandmarks(landmarks, { color: '#FF0055', radius: 3 });
                }

                for (let i = 0; i < rawHands.length; i++) {
                    const landmarks = rawHands[i];
                    const wrist = landmarks[0];          // 手腕中心點 X 座標
                    const indexTip = landmarks[8];       // 食指指尖 (點 8)
                    const middleTip = landmarks[12];     // 中指指尖 (點 12)
                    
                    // 以畫面 X 座標分邊（畫面鏡像後，X >= 0.5 為右側，反之左側）
                    let sideKey = wrist.x >= 0.5 ? 'left' : 'right'; 
                    let stats = sideStats[sideKey];

                    // 檢查食指或中指是否有往上抬起的動作（波峰偵測）
                    let indexMovedUp = (indexTip.y - stats.lastIndexY < -0.025);
                    let middleMovedUp = (middleTip.y - stats.lastMiddleY < -0.025);

                    // 雙指交替檢核邏輯：必須輪流抬起（不能連續用同一根手指作弊）
                    if (indexMovedUp && stats.lastActiveFinger !== 'index') {
                        stats.lastActiveFinger = 'index';
                        stats.steps++;
                    } else if (middleMovedUp && stats.lastActiveFinger !== 'middle') {
                        stats.lastActiveFinger = 'middle';
                        stats.steps++;
                    }

                    // 更新畫面分數
                    if (sideKey === 'left') scoreP1El.innerText = stats.steps;
                    else scoreP2El.innerText = stats.steps;

                    // 儲存當前座標供下一影格比對
                    stats.lastIndexY = indexTip.y;
                    stats.lastMiddleY = middleTip.y;
                }

                if (rawHands.length === 0) {
                    commandDisplay.innerText = "請把食指與中指伸入鏡頭跑步！";
                } else {
                    commandDisplay.innerText = `雙指交替跑步中 🏃‍♂️`;
                }

                canvasCtx.restore();
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }
    </script>
</body>
</html>
