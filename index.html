<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手指跑步競速（嚴格防作弊版）</title>
    <style>
        :root {
            --bg-color: #0b0f19;          
            --primary-color: #00f3ff;     
            --success-color: #00ffcc;     
            --text-color: #ffffff;        
            --border-glow: rgba(0, 243, 255, 0.2); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #rotate-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.95);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning .icon {
            font-size: 48px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-warning {
                display: flex;
            }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
        }

        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transform: scaleX(-1);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            pointer-events: none;
            box-sizing: border-box;
            padding: 10px 20px 16px 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        .player-zone {
            width: 48%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 15px;
            position: relative;
            border: 2px dashed var(--border-glow);
            box-sizing: border-box;
        }

        .player-header {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 5px;
        }

        .step-count {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--success-color);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        #command-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            text-align: center;
            pointer-events: none;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
        }

        #command-display {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
        }

        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #0066ff);
            color: var(--text-color);
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        
        .btn-primary:disabled {
            background: #2a3b4c;
            color: #ff8080;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="rotate-warning">
        <div class="icon">📱</div>
        <h2>請將手機轉為橫向</h2>
        <p>本遊戲需使用橫向畫面進行手指跑步競速</p>
    </div>

    <div id="game-container">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <div class="player-zone" id="zone-p1">
                <div class="player-header">左側區域步數</div>
                <div class="step-count" id="score-p1">0</div>
            </div>

            <div class="player-zone" id="zone-p2">
                <div class="player-header">右側區域步數</div>
                <div class="step-count" id="score-p2">0</div>
            </div>
        </div>

        <div id="command-container">
            <div id="command-display">請將食指與中指伸入鏡頭跑步</div>
        </div>

        <div id="overlay-screen" class="interactive">
            <h1 class="game-title">手指跑步競速</h1>
            <button class="btn-primary" id="start-btn" disabled>正在初始化手部模組...</button>
        </div>
    </div>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs";

        let handLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;

        // 紀錄左右兩側區域的雙指跑步狀態（包含 X 與 Y 座標供位移計算）
        const sideStats = {
            left: { steps: 0, lastIndexX: 0, lastIndexY: 0, lastMiddleX: 0, lastMiddleY: 0, lastActiveFinger: null },
            right: { steps: 0, lastIndexX: 0, lastIndexY: 0, lastMiddleX: 0, lastMiddleY: 0, lastActiveFinger: null }
        };

        const startBtn = document.getElementById('start-btn');
        const overlayScreen = document.getElementById('overlay-screen');
        const webcamVideo = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('game-canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const commandDisplay = document.getElementById('command-display');
        const scoreP1El = document.getElementById('score-p1');
        const scoreP2El = document.getElementById('score-p2');

        async function preloadModel() {
            try {
                startBtn.innerText = "正在載入 WASM...";
                const visionFilesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                );
                startBtn.innerText = "正在載入 AI 手部模型...";
                handLandmarker = await HandLandmarker.createFromOptions(visionFilesetResolver, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 2
                });
                startBtn.disabled = false;
                startBtn.innerText = "開始遊戲";
            } catch (err) {
                startBtn.innerText = "錯誤: " + err.message;
            }
        }

        preloadModel();

        startBtn.addEventListener('click', async () => {
            if (!handLandmarker) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                webcamVideo.srcObject = stream;
                webcamVideo.addEventListener('loadeddata', () => {
                    webcamRunning = true;
                    overlayScreen.style.opacity = '0';
                    setTimeout(() => overlayScreen.style.display = 'none', 300);
                    requestAnimationFrame(predictWebcam);
                });
            } catch (err) {
                alert('無法啟用攝影機');
            }
        });

        async function predictWebcam() {
            if (canvasElement.width !== webcamVideo.videoWidth || canvasElement.height !== webcamVideo.videoHeight) {
                canvasElement.width = webcamVideo.videoWidth;
                canvasElement.height = webcamVideo.videoHeight;
            }

            let startTimeMs = performance.now();
            if (lastVideoTime !== webcamVideo.currentTime) {
                lastVideoTime = webcamVideo.currentTime;
                const handResult = handLandmarker.detectForVideo(webcamVideo, startTimeMs);

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                let rawHands = handResult.landmarks || [];
                const w = canvasElement.width;
                const h = canvasElement.height;

                for (let i = 0; i < rawHands.length; i++) {
                    const landmarks = rawHands[i];
                    const wrist = landmarks[0];          
                    const indexTip = landmarks[8];       
                    const middleTip = landmarks[12];     
                    
                    // 繪製判定點
                    canvasCtx.fillStyle = '#00f3ff';
                    canvasCtx.beginPath();
                    canvasCtx.arc(wrist.x * w, wrist.y * h, 6, 0, 2 * Math.PI);
                    canvasCtx.fill();

                    canvasCtx.fillStyle = '#00ffcc';
                    [indexTip, middleTip].forEach(tip => {
                        canvasCtx.beginPath();
                        canvasCtx.arc(tip.x * w, tip.y * h, 10, 0, 2 * Math.PI);
                        canvasCtx.fill();
                        canvasCtx.strokeStyle = '#ffffff';
                        canvasCtx.lineWidth = 2;
                        canvasCtx.stroke();
                    });

                    let sideKey = wrist.x >= 0.5 ? 'left' : 'right'; 
                    let stats = sideStats[sideKey];

                    // 計算 X 軸與 Y 軸的位移量
                    let indexDeltaY = indexTip.y - stats.lastIndexY;
                    let indexDeltaX = Math.abs(indexTip.x - stats.lastIndexX);

                    let middleDeltaY = middleTip.y - stats.lastMiddleY;
                    let middleDeltaX = Math.abs(middleTip.x - stats.lastMiddleX);

                    // 【嚴格防作弊條件】：
                    // 1. Y 軸向上起伏必須夠大（門檻從 -0.025 提升至更嚴格的 -0.04）
                    // 2. 必須排除水平干擾：垂直向上的位移量必須明顯大於水平位移量（indexDeltaY < -0.04 且 |indexDeltaY| > indexDeltaX * 1.5）
                    let indexMovedUpStrict = (indexDeltaY < -0.04 && Math.abs(indexDeltaY) > indexDeltaX * 1.5);
                    let middleMovedUpStrict = (middleDeltaY < -0.04 && Math.abs(middleDeltaY) > middleDeltaX * 1.5);

                    // 雙指交替檢核邏輯
                    if (indexMovedUpStrict && stats.lastActiveFinger !== 'index') {
                        stats.lastActiveFinger = 'index';
                        stats.steps++;
                    } else if (middleMovedUpStrict && stats.lastActiveFinger !== 'middle') {
                        stats.lastActiveFinger = 'middle';
                        stats.steps++;
                    }

                    if (sideKey === 'left') scoreP1El.innerText = stats.steps;
                    else scoreP2El.innerText = stats.steps;

                    // 記錄當前 X 與 Y 座標供下一影格比對
                    stats.lastIndexX = indexTip.x;
                    stats.lastIndexY = indexTip.y;
                    stats.lastMiddleX = middleTip.x;
                    stats.lastMiddleY = middleTip.y;
                }

                if (rawHands.length === 0) {
                    commandDisplay.innerText = "請將食指與中指伸入鏡頭跑步！";
                } else {
                    commandDisplay.innerText = `雙指嚴格交替跑步中 🏃‍♂️`;
                }

                canvasCtx.restore();
            }

            if (webcamRunning) {
                requestAnimationFrame(predictWebcam);
            }
        }
    </script>
</body>
</html>
